<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Guitar Basics Quiz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

/* COLORS */

:root{

    --bg:#0a0a0a;
    --sidebar:#111;
    --card:#111;
    --text:white;
    --accent:#1aff66;
    --border:#1aff66;
}

body.light-mode{

    --bg:#c19058;
    --sidebar:#b88652;
    --card:#eadcc8;
    --text:#4b2d16;
    --accent:#7a431d;
    --border:#7a431d;
}

/* BODY */

body{

    display:flex;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:0.4s;
}

/* SIDEBAR */

.sidebar{

    width:230px;
    background:var(--sidebar);
    border-right:2px solid var(--border);
    padding:20px;
}

.logo{

    text-align:center;
    margin-bottom:40px;
}

.logo img{

    width:120px;
}

.menu{

    display:flex;
    flex-direction:column;
    gap:20px;
}

.menu a{

    color:var(--text);
    text-decoration:none;
    padding:12px;
    border-radius:12px;
    transition:0.3s;
    font-weight:bold;
}

.menu a:hover{

    background:var(--accent);
    color:black;
}

body.light-mode .menu a:hover{

    color:white;
}

.active{

    background:var(--accent);
    color:black !important;
}

body.light-mode .active{

    color:white !important;
}

/* MAIN */

.main{

    flex:1;
    padding:40px;
}

/* TOP BAR */

.top-bar{

    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    flex-wrap:wrap;
    gap:15px;
}

/* TITLE */

.quiz-title{

    color:var(--accent);
    font-size:42px;
}

/* BUTTON */

.theme-btn{

    padding:14px 24px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    font-size:16px;
}

.theme-btn:hover{

    transform:scale(1.03);
}

body.light-mode .theme-btn{

    color:white;
}

/* QUIZ BOX */

.quiz-box{

    background:var(--card);
    border:2px solid var(--border);
    border-radius:25px;
    padding:35px;
    box-shadow:0 0 20px var(--accent);
}

/* QUESTION */

.question{

    font-size:28px;
    color:var(--accent);
    margin-bottom:30px;
}

/* OPTIONS */

.options{

    display:flex;
    flex-direction:column;
    gap:18px;
}

.option{

    background:var(--bg);
    border:2px solid var(--border);
    color:var(--text);

    border-radius:15px;
    padding:18px;

    cursor:pointer;
    transition:0.3s;
    font-size:18px;
}

.option:hover{

    background:var(--accent);
    color:black;
    transform:scale(1.02);
}

body.light-mode .option:hover{

    color:white;
}

.selected{

    background:var(--accent);
    color:black;
}

body.light-mode .selected{

    color:white;
}

/* SUBMIT BUTTON */

.submit-btn{

    margin-top:35px;
    width:100%;
    padding:18px;

    border:none;
    border-radius:15px;

    background:var(--accent);
    color:black;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;
    transition:0.3s;
}

.submit-btn:hover{

    box-shadow:0 0 20px var(--accent);
}

body.light-mode .submit-btn{

    color:white;
}

/* RESULT */

.result-box{

    text-align:center;
}

.result-box h1{

    color:var(--accent);
    margin-bottom:15px;
}

/* PROGRESS */

.progress-section{

    margin-top:35px;
}

.progress-title{

    color:var(--accent);
    margin-bottom:10px;
}

.progress-bar{

    width:100%;
    height:12px;

    background:#1f1f1f;
    border-radius:20px;

    overflow:hidden;
}

.progress{

    width:0%;
    height:100%;

    background:var(--accent);

    box-shadow:0 0 10px var(--accent);
}

/* RESPONSIVE */

@media(max-width:900px){

    body{

        flex-direction:column;
    }

    .sidebar{

        width:100%;
        border-right:none;
        border-bottom:2px solid var(--border);
    }

    .top-bar{

        flex-direction:column;
        align-items:flex-start;
    }
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

        <img src="logo/darkL.png"
        id="logo">

    </div>

    <div class="menu">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="lesson.html">
            Lessons
        </a>

        <a href="#"
        class="active">
            Quiz
        </a>

        <a href="calendar.html">
            Calendar
        </a>

        <a href="ToneDeaf.html">
            Tone Test
        </a>

    </div>

</div>

<!-- MAIN -->

<div class="main">

    <div class="top-bar">

        <h1 class="quiz-title">
            GUITAR BASICS QUIZ
        </h1>

        <button class="theme-btn"
        onclick="toggleTheme()">

            Dark / Light Mode

        </button>

    </div>

    <!-- QUIZ BOX -->

    <div class="quiz-box"
    id="quizBox">

        <h2 class="question"
        id="question"></h2>

        <div class="options"
        id="options"></div>

        <button class="submit-btn"
        onclick="submitAnswer()">

            Submit Answer

        </button>

        <div class="progress-section">

            <h3 class="progress-title"
            id="progressText">

                Progress

            </h3>

            <div class="progress-bar">

                <div class="progress"
                id="progressBar"></div>

            </div>

        </div>

    </div>

</div>

<script>

/* QUIZ QUESTIONS */

const quiz = [

{
question:
"Which guitar string has the highest pitch?",

choices:
["Low E","A","B","High E"],

answer:
"High E"
},

{
question:
"Which guitar string is the thickest string?",

choices:
["High E","B","Low E","G"],

answer:
"Low E"
},

{
question:
"How many strings does a standard guitar have?",

choices:
["4","5","6","7"],

answer:
"6"
},

{
question:
"What are the names of the standard guitar strings from thickest to thinnest?",

choices:
[
"E A D G B e",
"A B C D E F",
"E G A B D F",
"C D E F G A"
],

answer:
"E A D G B e"
},

{
question:
"What type of chord usually sounds bright and happy?",

choices:
[
"Minor Chord",
"Power Chord",
"Major Chord",
"Muted Chord"
],

answer:
"Major Chord"
},

{
question:
"What type of chord usually sounds emotional or sad?",

choices:
[
"Major Chord",
"Power Chord",
"Minor Chord",
"Open Chord"
],

answer:
"Minor Chord"
},

{
question:
"Which chord is considered one of the easiest beginner chords?",

choices:
[
"E Minor",
"G Major",
"D Major",
"C Major"
],

answer:
"E Minor"
},

{
question:
"What does a power chord like E5 mainly create?",

choices:
[
"A soft sound",
"A jazzy sound",
"A powerful rock sound",
"A classical sound"
],

answer:
"A powerful rock sound"
},

{
question:
"Which chord uses all 6 strings when strummed?",

choices:
[
"D Major",
"A Major",
"G Major",
"E Minor"
],

answer:
"G Major"
},

{
question:
"What does the letter 'm' mean in chords like Am or Em?",

choices:
[
"Muted",
"Major",
"Minor",
"Middle"
],

answer:
"Minor"
}

];

/* VARIABLES */

let currentQuestion = 0;
let score = 0;
let selectedAnswer = "";

/* ELEMENTS */

const question =
document.getElementById("question");

const options =
document.getElementById("options");

const progressText =
document.getElementById("progressText");

const progressBar =
document.getElementById("progressBar");

/* LOAD QUESTION */

function loadQuestion(){

    const q =
    quiz[currentQuestion];

    question.textContent =
    q.question;

    options.innerHTML = "";

    q.choices.forEach(choice => {

        const div =
        document.createElement("div");

        div.classList.add("option");

        div.textContent =
        choice;

        div.onclick = () => {

            document
            .querySelectorAll(".option")
            .forEach(opt =>
            opt.classList.remove("selected"));

            div.classList.add("selected");

            selectedAnswer =
            choice;
        };

        options.appendChild(div);
    });

    let progress =
    ((currentQuestion)
    / quiz.length) * 100;

    progressBar.style.width =
    progress + "%";

    progressText.textContent =
    "Progress - " +
    Math.round(progress)
    + "%";
}

/* SUBMIT */

function submitAnswer(){

    if(selectedAnswer === ""){

        alert(
        "Please select an answer."
        );

        return;
    }

    if(selectedAnswer ===
    quiz[currentQuestion].answer){

        score++;
    }

    currentQuestion++;

    selectedAnswer = "";

    if(currentQuestion <
    quiz.length){

        loadQuestion();

    } else {

        finishQuiz();
    }
}

/* FINISH */

function finishQuiz(){

    document.getElementById(
    "quizBox"
    ).innerHTML = `

    <div class="result-box">

        <h1>
            Quiz Completed!
        </h1>

        <h2>
            Your Score:
            ${score} / ${quiz.length}
        </h2>

    </div>

    `;
}

/* THEME */

function toggleTheme(){

    document.body.classList.toggle(
    "light-mode"
    );

    const logo =
    document.getElementById(
    "logo"
    );

    if(
    document.body.classList.contains(
    "light-mode"
    )
    ){

        logo.src =
        "logo/lightL.png";

        localStorage.setItem(
        "theme",
        "light"
        );

    } else {

        logo.src =
        "logo/darkL.png";

        localStorage.setItem(
        "theme",
        "dark"
        );
    }
}

/* LOAD SAVED THEME */

const savedTheme =
localStorage.getItem(
"theme"
);

if(savedTheme === "light"){

    document.body.classList.add(
    "light-mode"
    );

    document.getElementById(
    "logo"
    ).src =
    "logo/lightL.png";
}

/* START */

loadQuestion();

</script>

</body>
</html>
