<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LFP Calendar</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    min-height:100vh;
    transition:0.4s;
}

body.light-mode{
    background:#c19058;
    color:#5a3215;
}

.navbar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    background:#111;
    border-bottom:3px solid #1aff66;
    transition:0.4s;
}

body.light-mode .navbar{
    background:#b88652;
    border-bottom:3px solid #6d3f1c;
}

.logo-img{
    width:170px;
}

.menu{
    display:flex;
    gap:35px;
}

.menu a{
    color:white;
    text-decoration:none;
    transition:0.3s;
    font-size:20px;
    font-weight:bold;
}

body.light-mode .menu a{
    color:#4b2d16;
}

.menu a:hover{
    color:#1aff66;
}

body.light-mode .menu a:hover{
    color:white;
}

.theme-btn{
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:#1aff66;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    font-size:16px;
}

body.light-mode .theme-btn{
    background:#7a431d;
    color:white;
}

.wrapper{
    display:flex;
    justify-content:center;
    padding:50px;
}

.calendar{
    width:95%;
    max-width:1200px;
    background:#161616;
    padding:40px;
    border-radius:30px;
    border:2px solid #00ff99;
    box-shadow:0 0 25px #00ff99;
    transition:0.4s;
}

body.light-mode .calendar{
    background:#d7b38a;
    border:2px solid #8b5a2b;
    box-shadow:none;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#00ff99;
    font-size:50px;
}

body.light-mode h1{
    color:#7a431d;
}

.month{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:30px;
}

.month h2{
    font-size:35px;
}

.days,
.dates{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:15px;
}

.days div{
    text-align:center;
    font-weight:bold;
    padding:15px;
    color:#00ff99;
    font-size:22px;
}

body.light-mode .days div{
    color:#7a431d;
}

.date{
    background:#1e1e1e;
    border:1px solid #2a2a2a;
    border-radius:20px;
    min-height:130px;
    padding:15px;
    transition:0.3s;
    cursor:pointer;
    position:relative;
    font-size:18px;
}

body.light-mode .date{
    background:#eadcc8;
    border:1px solid #8b5a2b;
}

.date:hover{
    border:2px solid #00ff99;
    transform:scale(1.03);
}

body.light-mode .date:hover{
    border:2px solid #7a431d;
}

.date span{
    font-weight:bold;
    font-size:22px;
}

.schedule{
    margin-top:10px;
    font-size:14px;
    color:#00ff99;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#111;
    padding:8px;
    border-radius:10px;
}

body.light-mode .schedule{
    background:#d7b38a;
    color:#7a431d;
}

.delete-btn{
    background:transparent;
    border:none;
    color:red;
    cursor:pointer;
    font-size:16px;
    margin-left:10px;
}

.add-btn,
.clear-btn{
    margin-top:30px;
    width:100%;
    padding:18px;
    border:none;
    border-radius:15px;
    background:#00ff99;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    font-size:18px;
}

body.light-mode .add-btn,
body.light-mode .clear-btn{
    background:#7a431d;
    color:white;
}

.add-btn:hover,
.clear-btn:hover{
    transform:scale(1.02);
}

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
}

.popup-content{
    background:#161616;
    border:2px solid #00ff99;
    padding:35px;
    border-radius:25px;
    width:400px;
    box-shadow:0 0 20px #00ff99;
    transition:0.4s;
}

body.light-mode .popup-content{
    background:#eadcc8;
    border:2px solid #8b5a2b;
    box-shadow:none;
}

.popup-content h2{
    color:#00ff99;
    margin-bottom:20px;
    text-align:center;
    font-size:32px;
}

body.light-mode .popup-content h2{
    color:#7a431d;
}

.popup-content input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:16px;
}

body.light-mode .popup-content input{
    background:#fff4e8;
    color:#5a3215;
}

.popup-content button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#00ff99;
    color:black;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

body.light-mode .popup-content button{
    background:#7a431d;
    color:white;
}

.close-btn{
    margin-top:10px;
    background:#222 !important;
    color:white !important;
}

@media(max-width:900px){

    .navbar{
        flex-direction:column;
        gap:20px;
    }

    .menu{
        flex-wrap:wrap;
        justify-content:center;
    }

    .days,
    .dates{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>

<body>

<div class="navbar">

    <img src="logo/darkL.png"
    class="logo-img"
    id="logo">

    <div class="menu">

        <a href="dashboard.html">Dashboard</a>
        <a href="lesson.html">Lessons</a>
        <a href="Quiz.html">Quiz</a>
        <a href="calendar.html">Calendar</a>
        <a href="ToneDeaf.html">Tone Test</a>

    </div>

    <button class="theme-btn"
    onclick="toggleTheme()">

        Dark / Light Mode

    </button>

</div>

<div class="wrapper">

<div class="calendar">

    <h1>Practice Calendar</h1>

 <div class="month">

    <button class="theme-btn"
    onclick="changeMonth(-1)">
        ◀
    </button>

    <h2 id="monthYear"></h2>

    <button class="theme-btn"
    onclick="changeMonth(1)">
        ▶
    </button>

</div>

<div class="days">

    <div>Sun</div>
    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div>Sat</div>

</div>

<div class="dates"
id="datesContainer">

</div>

    <button class="add-btn"
    onclick="openPopup()">

        + Add Schedule

    </button>

    <button class="clear-btn"
    onclick="clearAllSchedules()">

        Clear All

    </button>

</div>

</div>

<div class="popup"
id="popup">

  <div class="popup-content">

      <h2>Add Practice</h2>

      <input type="number"
      id="dayInput"
      placeholder="Enter Day">

      <input type="text"
      id="taskInput"
      placeholder="Practice Task">

      <input type="time"
      id="timeInput">

      <button onclick="saveSchedule()">

          Save

      </button>

      <button class="close-btn"
      onclick="closePopup()">

          Close

      </button>

  </div>

</div>

<script>

if(Notification.permission !== "granted"){
    Notification.requestPermission();
}

/* CALENDAR VARIABLES */

let currentDate = new Date();

let currentMonth =
currentDate.getMonth();

let currentYear =
currentDate.getFullYear();

/* THEME */

function toggleTheme(){

    document.body.classList.toggle(
    "light-mode"
    );

    const logo =
    document.getElementById(
    "logo"
    );

    if(
    document.body.classList.contains(
    "light-mode"
    )){

        logo.src =
        "logo/lightL.png";

        localStorage.setItem(
        "theme",
        "light"
        );

    }else{

        logo.src =
        "logo/darkL.png";

        localStorage.setItem(
        "theme",
        "dark"
        );
    }
}

const savedTheme =
localStorage.getItem(
"theme"
);

const logo =
document.getElementById(
"logo"
);

if(savedTheme === "light"){

    document.body.classList.add(
    "light-mode"
    );

    logo.src =
    "logo/lightL.png";

}else{

    logo.src =
    "logo/darkL.png";
}

/* GENERATE CALENDAR */

function generateCalendar(){

    const datesContainer =
    document.getElementById(
    "datesContainer"
    );

    datesContainer.innerHTML = "";

    const monthNames = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];

    document.getElementById(
    "monthYear"
    ).textContent =
    monthNames[currentMonth]
    + " " +
    currentYear;

    const totalDays =
    new Date(
    currentYear,
    currentMonth + 1,
    0
    ).getDate();

    for(
    let day = 1;
    day <= totalDays;
    day++
    ){

        const date =
        document.createElement(
        "div"
        );

        date.classList.add(
        "date"
        );

        date.innerHTML =
        `<span>${day}</span>`;

        datesContainer.appendChild(
        date
        );

        loadSavedTask(
        date,
        day
        );
    }
}

/* CHANGE MONTH */

function changeMonth(direction){

    currentMonth += direction;

    if(currentMonth > 11){

        currentMonth = 0;

        currentYear++;
    }

    if(currentMonth < 0){

        currentMonth = 11;

        currentYear--;
    }

    generateCalendar();
}

/* POPUP */

function openPopup(){

    document.getElementById(
    "popup"
    ).style.display =
    "flex";
}

function closePopup(){

    document.getElementById(
    "popup"
    ).style.display =
    "none";
}

/* SAVE SCHEDULE */

function saveSchedule(){

    const day =
    document.getElementById(
    "dayInput"
    ).value;

    const task =
    document.getElementById(
    "taskInput"
    ).value;

    const time =
    document.getElementById(
    "timeInput"
    ).value;

    if(
    day === "" ||
    task === "" ||
    time === ""
    ){

        alert(
        "Please complete all fields."
        );

        return;
    }

    const key =
    `calendarTask-${currentYear}-${currentMonth}-${day}`;

    localStorage.setItem(
    key,
    JSON.stringify({
        task:task,
        time:time
    })
    );

    scheduleNotification(
    task,
    time
    );

    generateCalendar();

    closePopup();

    document.getElementById(
    "dayInput"
    ).value = "";

    document.getElementById(
    "taskInput"
    ).value = "";

    document.getElementById(
    "timeInput"
    ).value = "";
}

/* LOAD SAVED TASK */

function loadSavedTask(
date,
day
){

    const key =
    `calendarTask-${currentYear}-${currentMonth}-${day}`;

    const savedTask =
    localStorage.getItem(
    key
    );

    if(savedTask){

        const data =
        JSON.parse(
        savedTask
        );

        const taskDiv =
        document.createElement(
        "div"
        );

        taskDiv.classList.add(
        "schedule"
        );

        taskDiv.innerHTML =
        `✔ ${data.task} (${data.time})`;

        const deleteBtn =
        document.createElement(
        "button"
        );

        deleteBtn.textContent =
        "✖";

        deleteBtn.classList.add(
        "delete-btn"
        );

        deleteBtn.onclick =
        function(){

            localStorage.removeItem(
            key
            );

            generateCalendar();
        };

        taskDiv.appendChild(
        deleteBtn
        );

        date.appendChild(
        taskDiv
        );
    }
}

/* NOTIFICATIONS */

function scheduleNotification(
task,
time
){

    if(
    Notification.permission
    === "granted"
    ){

        const now =
        new Date();

        const target =
        new Date();

        const splitTime =
        time.split(":");

        target.setHours(
        splitTime[0]
        );

        target.setMinutes(
        splitTime[1]
        );

        target.setSeconds(0);

        const timeout =
        target.getTime() -
        now.getTime();

        if(timeout > 0){

            setTimeout(() => {

                new Notification(
                "LFP Practice Reminder",
                {
                    body:
                    "It's time for: "
                    + task,

                    icon:
                    "logo/darkL.png"
                });

            }, timeout);
        }
    }
}

/* CLEAR ALL */

function clearAllSchedules(){

    Object.keys(
    localStorage
    ).forEach(key => {

        if(
        key.startsWith(
        "calendarTask-"
        )
        ){

            localStorage.removeItem(
            key
            );
        }

    });

    generateCalendar();
}

/* START */

window.onload =
function(){

    generateCalendar();

};

</script>
</body>
</html>
