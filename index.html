<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Lumen Fret Path</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:black;
    color:white;
    overflow:hidden;
}

#intro{
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:100;
    cursor:pointer;
    transition:1.5s;
}

.logo-img{
    width:380px;
    animation:glow 2s infinite alternate;
}

@keyframes glow{

    from{
        filter:drop-shadow(0 0 15px #1aff66);
    }

    to{
        filter:drop-shadow(0 0 35px #1aff66);
    }

}

.fade{
    opacity:0;
    visibility:hidden;
}

#main-LFP{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    transition:1s;
    padding:20px;
}

#main-LFP.show{
    opacity:1;
}

.login{
    width:1100px;
    height:680px;
    background:#111;
    border-radius:35px;
    overflow:hidden;
    display:flex;
    box-shadow:0 0 35px #1aff66;
}

.login-img{
    flex:1;
    background:
    linear-gradient(
    rgba(0,0,0,0.4),
    rgba(0,0,0,0.8)
    ),
    url('loginIMG.png')
    center/cover;
}

.login-user{
    flex:1;
    padding:70px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.login-user h2{
    text-align:center;
    color:#1aff66;
    margin-bottom:15px;
    font-size:60px;
}

.sign-in{
    text-align:center;
    color:#aaa;
    margin-bottom:40px;
    font-size:22px;
}

.input{
    margin-bottom:28px;
}

.input input{
    width:100%;
    padding:20px;
    border:none;
    border-radius:16px;
    background:#1b1b1b;
    color:white;
    outline:none;
    border:1px solid #333;
    font-size:18px;
}

.input input:focus{
    border:1px solid #1aff66;
    box-shadow:0 0 15px #1aff66;
}

.input-options{
    display:flex;
    justify-content:space-between;
    margin-bottom:30px;
    font-size:18px;
}

.input-options a{
    color:#1aff66;
    text-decoration:none;
}

.btn-next{
    padding:20px;
    border:none;
    border-radius:16px;
    background:#1aff66;
    color:black;
    font-weight:bold;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.btn-next:hover{
    transform:scale(1.02);
    box-shadow:0 0 20px #1aff66;
}

.or{
    text-align:center;
    margin:30px 0;
    color:#777;
    font-size:20px;
}

.btn-google{
    padding:20px;
    border:none;
    border-radius:16px;
    background:#222;
    color:white;
    cursor:pointer;
    transition:0.3s;
    font-size:20px;
}

.btn-google:hover{
    background:#333;
}

.signup{
    margin-top:35px;
    text-align:center;
    color:#999;
    font-size:18px;
}

.signup a{
    color:#1aff66;
    text-decoration:none;
}
.password-box{
    position:relative;
}

.password-box input{
    width:100%;
    padding-right:60px;
}

.toggle-password{

    position:absolute;

    right:15px;
    top:50%;

    transform:translateY(-50%);

    background:none;
    border:none;

    color:#1aff66;

    font-size:22px;

    cursor:pointer;
}

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .login{
        flex-direction:column;
        width:95%;
        height:auto;
    }

    .login-img{
        height:300px;
    }

    .login-user{
        padding:40px;
    }

    .login-user h2{
        font-size:45px;
    }

}


</style>
</head>

<body>


<div id="intro">

    <img src="logo/darkL.png"
    class="logo-img">

</div>


<div id="main-LFP">

    <div class="login">

        <div class="login-img"img src="loginIMG.png"></div>


        <div class="login-user">

            <h2>Welcome</h2>

            <p class="sign-in">
                Please sign in to continue
            </p>


            <div class="input">

                <input type="email"
                id="username"
                placeholder="Email">

            </div>


      <div class="input password-box">

    <input
    type="password"
    id="password"
    placeholder="Password">

    <button
    type="button"
    class="toggle-password"
    onclick="togglePassword()">

        👁

    </button>

</div>


            <div class="input-options">

                <label>

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>

            <button class="btn-next"
            onclick="login()">

                Login

            </button>


            <div class="or">
                OR
            </div>

            <button class="btn-google">

                Continue with Google

            </button>

            <p class="signup">

                Don't have an account?

                <a href="#"
                onclick="signup()">

                    Sign up

                </a>

            </p>

        </div>

    </div>

</div>




<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

 
  const firebaseConfig = {
   apiKey: "AIzaSyDbk9-jlBbOFv6uUnlRLF0f0Efe1-gJGkM",
  authDomain: "lumen-fret-path.firebaseapp.com",
  projectId: "lumen-fret-path",
  storageBucket: "lumen-fret-path.firebasestorage.app",
  messagingSenderId: "607922775434",
  appId: "1:607922775434:web:f528986b75fb2b860a1473",
  };


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);



const intro =
document.getElementById("intro");

const main =
document.getElementById("main-LFP");

intro.addEventListener("click", () => {

    intro.classList.add("fade");

    main.classList.add("show");

});
window.togglePassword = function(){

    const password =
    document.getElementById(
    "password"
    );

    const eyeButton =
    document.querySelector(
    ".toggle-password"
    );

    if(password.type === "password"){

        password.type = "text";

        eyeButton.textContent = "🔒";

    } else {

        password.type = "password";

        eyeButton.textContent = "👁";
    }
}
window.signup = function(){

    const email =
    document.getElementById(
    "username"
    ).value;

    const password =
    document.getElementById(
    "password"
    ).value;


    createUserWithEmailAndPassword(

    auth,
    email,
    password

    )

    .then((userCredential) => {

        alert(
        "Account Created!"
        );

    })

    .catch((error) => {

        alert(error.message);

    });

}


window.login = function(){

    const email =
    document.getElementById(
    "username"
    ).value;

    const password =
    document.getElementById(
    "password"
    ).value;


    signInWithEmailAndPassword(

    auth,
    email,
    password

    )

    .then((userCredential) => {

        localStorage.setItem(
        "username",
        email
        );

        alert(
        "Login Success!"
        );

        window.location.href =
        "dashboard.html";

    })

    .catch((error) => {

        alert(error.message);

    });

}
if(localStorage.getItem("username")){

    window.location.href =
    "dashboard.html";
}
if(localStorage.getItem("username")){

    window.location.href =
    "dashboard.html";
}

</script>

</body>
</html>
